<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TERECONET Professional Updates</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --text: #121212;
      --muted: #5f6368;
      --border: #e3e6ea;
      --strong-border: #d0d5dc;
      --accent: #111111;
      --accent-soft: #f0f1f3;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 16px 56px;
      line-height: 1.65;
    }

    header {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px 20px;
      box-shadow: var(--shadow);
      margin-bottom: 22px;
    }

    h1 {
      margin: 0 0 8px 0;
      font-size: 1.7rem;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      line-height: 1.3;
    }

    h2 {
      margin: 0 0 12px 0;
      font-size: 1rem;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .subheading {
      margin: 0;
      color: var(--muted);
      font-size: 0.98rem;
    }

    a {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 2px;
      font-weight: 600;
    }

    a:hover {
      opacity: 0.85;
      text-decoration-thickness: 2px;
    }

    .top-dashboard {
      display: grid;
      grid-template-columns: 1fr 1.6fr;
      gap: 18px;
      margin-bottom: 24px;
    }

    .calendar-container,
    .notice-board {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px 16px;
    }

    .calendar-table {
      width: 100%;
      text-align: center;
      border-collapse: collapse;
      margin-top: 4px;
      font-size: 0.93rem;
    }

    .calendar-table th {
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
      font-size: 0.78rem;
      padding: 8px 4px;
      border-bottom: 1px solid var(--border);
    }

    .calendar-table td {
      padding: 9px 4px;
      border-bottom: 1px solid #f0f2f5;
      color: #2a2f36;
    }

    .today {
      background-color: #111;
      color: #fff;
      font-weight: 700;
      border-radius: 8px;
    }

    .urgent-item {
      padding: 10px 0;
      border-bottom: 1px dashed var(--strong-border);
    }

    .urgent-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .urgent-title {
      font-weight: 700;
      margin-bottom: 5px;
    }

    .urgent-days {
      display: inline-block;
      background: #111;
      color: #fff;
      padding: 3px 8px;
      font-size: 0.82rem;
      margin-top: 5px;
      border-radius: 999px;
      font-weight: 700;
    }

    .category-section {
      margin-bottom: 28px;
    }

    .category-heading {
      display: inline-block;
      margin-bottom: 12px;
      background: var(--accent-soft);
      color: #1b1f24;
      border: 1px solid var(--strong-border);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.84rem;
      font-weight: 700;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }

    .post {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
      margin-bottom: 14px;
    }

    .title {
      font-size: 1.15rem;
      line-height: 1.4;
      font-weight: 800;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 16px;
      margin-bottom: 12px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fafbfc;
      font-size: 0.92rem;
    }

    .meta strong {
      text-transform: uppercase;
      font-size: 0.78rem;
      letter-spacing: 0.25px;
      color: #2f3338;
      margin-right: 4px;
    }

    .content {
      margin-top: 2px;
      color: #23272d;
      white-space: pre-wrap;
    }

    #urgent-feed > p,
    #categorized-feed > p {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
      color: var(--muted);
      margin: 0;
    }

    @media (max-width: 860px) {
      .top-dashboard,
      .meta {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>TERECONET Professional Updates</h1>
    <p class="subheading">Prepared by Dr Tran Thanh Vu (<a href="mailto:vutranthanh.ed@gmail.com">vutranthanh.ed@gmail.com</a>)</p>
  </header>

  <div class="top-dashboard">
    <div class="calendar-container">
      <h2 id="cal-month-year" style="margin-top: 0;">Calendar</h2>
      <div id="calendar-wrapper"></div>
    </div>

    <div class="notice-board">
      <h2 style="margin-top: 0;">Ending Soon (Next 5 Days)</h2>
      <div id="urgent-feed">
        <p>Loading urgent calls...</p>
      </div>
    </div>
  </div>

  <div id="categorized-feed">
    <p>Loading updates...</p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "tereconet-updates.firebaseapp.com",
      databaseURL: "https://tereconet-updates-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "tereconet-updates",
      storageBucket: "tereconet-updates.firebasestorage.app",
      messagingSenderId: "9697582206",
      appId: "1:9697582206:web:64e784273c913f34d24c2f",
      measurementId: "G-1V47RZBFSR"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function getLocalISODate() {
      const now = new Date();
      const local = new Date(now.getTime() - now.getTimezoneOffset() * 60000);
      return local.toISOString().slice(0, 10); // YYYY-MM-DD
    }

    function formatDate(isoDate) {
      if (!isoDate || typeof isoDate !== 'string') return 'N/A';
      const parts = isoDate.split('-');
      return parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : isoDate;
    }

    function renderCalendar() {
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth();
      document.getElementById('cal-month-year').innerText = now.toLocaleString('en-GB', { month: 'long', year: 'numeric' });

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      let html = '<table class="calendar-table"><tr><th>Su</th><th>Mo</th><th>Tu</th><th>We</th><th>Th</th><th>Fr</th><th>Sa</th></tr><tr>';
      let day = 1;

      for (let i = 0; i < 42; i++) {
        if (i < firstDay || day > daysInMonth) {
          html += '<td></td>';
        } else {
          const isToday = day === now.getDate() ? 'class="today"' : '';
          html += `<td ${isToday}>${day}</td>`;
          day++;
        }
        if ((i + 1) % 7 === 0 && day <= daysInMonth) html += '</tr><tr>';
      }
      html += '</tr></table>';
      document.getElementById('calendar-wrapper').innerHTML = html;
    }
    renderCalendar();

    db.ref('updates').on('value', (snapshot) => {
      const container = document.getElementById('categorized-feed');
      const urgentFeed = document.getElementById('urgent-feed');
      container.innerHTML = '';
      urgentFeed.innerHTML = '';

      const updates = [];
      snapshot.forEach((child) => {
        updates.push({ id: child.key, ...child.val() });
      });

      const todayISO = getLocalISODate();

      // Keep only active posts (deadline today or future)
      const activeUpdates = updates.filter(u => u && u.deadline && u.deadline >= todayISO);

      if (activeUpdates.length === 0) {
        container.innerHTML = '<p>No active updates at this time.</p>';
        urgentFeed.innerHTML = '<p>No imminent deadlines.</p>';
        return;
      }

      activeUpdates.sort((a, b) => a.deadline.localeCompare(b.deadline));

      let urgentCount = 0;
      activeUpdates.forEach(update => {
        const today = new Date(todayISO + 'T00:00:00');
        const dl = new Date(update.deadline + 'T00:00:00');
        const diffDays = Math.ceil((dl - today) / (1000 * 60 * 60 * 24));

        if (diffDays >= 0 && diffDays <= 5) {
          urgentCount++;
          urgentFeed.innerHTML += `
            <div class="urgent-item">
              <div class="urgent-title">${update.title || 'Untitled'}</div>
              <div class="urgent-days">Deadline: ${formatDate(update.deadline)} (${diffDays === 0 ? 'Today' : diffDays + ' days left'})</div>
            </div>
          `;
        }
      });

      if (urgentCount === 0) {
        urgentFeed.innerHTML = '<p>No imminent deadlines.</p>';
      }

      const categories = {};
      activeUpdates.forEach(update => {
        const cat = update.category || 'Other Updates';
        if (!categories[cat]) categories[cat] = [];
        categories[cat].push(update);
      });

      Object.entries(categories).forEach(([categoryName, items]) => {
        let sectionHtml = `
          <div class="category-section">
            <div class="category-heading">${categoryName}</div>
        `;

        items.forEach(update => {
          sectionHtml += `
            <div class="post">
              <div class="title">${update.title || 'Untitled'}</div>
              <div class="meta">
                <div><strong>Date:</strong> ${formatDate(update.date)}</div>
                <div><strong>Deadline:</strong> ${formatDate(update.deadline)}</div>
                <div><strong>Location:</strong> ${update.location || 'N/A'}</div>
                <div><strong>Editor(s):</strong><br>${(update.editor || 'N/A').replace(/\n/g, '<br>')}</div>
              </div>
              <div class="content">${(update.description || '').replace(/\n/g, '<br>')}</div>
              ${update.link ? `<br><a href="${update.link}" target="_blank" rel="noopener noreferrer">View Original Call &rarr;</a>` : ''}
            </div>
          `;
        });

        sectionHtml += `</div>`;
        container.innerHTML += sectionHtml;
      });
    });
  </script>
</body>
</html>
